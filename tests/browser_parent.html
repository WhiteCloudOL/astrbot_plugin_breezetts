<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
      }
      iframe {
        width: 100%;
        height: 100vh;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <script>
      // Test parent uses the real SDK in a sandboxed iframe and real authenticated APIs.
      const auth = AUTH_PLACEHOLDER;
      window.addEventListener("message", async (event) => {
        const message = event.data;
        if (message?.channel !== "astrbot-plugin-page") return;
        const reply = (data) =>
          event.source.postMessage(
            { channel: "astrbot-plugin-page", ...data },
            "*",
          );
        if (message.kind === "ready") {
          reply({
            kind: "context",
            context: { locale: "zh-CN", isDark: false },
          });
          return;
        }
        if (message.kind !== "request") return;
        try {
          const url = new URL(
            "/api/v1/plugins/extensions/astrbot_plugin_breezetts/" +
              message.endpoint,
            location.origin,
          );
          for (const [key, value] of Object.entries(message.params || {}))
            url.searchParams.set(key, value);
          const options = { headers: { Authorization: auth } };
          if (message.action === "api:post") {
            options.method = "POST";
            options.headers["Content-Type"] = "application/json";
            options.body = JSON.stringify(message.body);
          }
          if (message.action === "files:upload") {
            options.method = "POST";
            const form = new FormData();
            form.append(
              "file",
              new Blob([message.fileBuffer], { type: message.fileType }),
              message.fileName,
            );
            options.body = form;
          }
          const response = await fetch(url, options);
          if (message.action === "files:download" && response.ok) {
            const objectUrl = URL.createObjectURL(await response.blob());
            const anchor = document.createElement("a");
            anchor.href = objectUrl;
            anchor.download = message.filename;
            anchor.click();
            URL.revokeObjectURL(objectUrl);
            reply({
              kind: "response",
              requestId: message.requestId,
              ok: true,
              data: { filename: message.filename },
            });
            return;
          }
          const data = await response.json();
          if (!response.ok || data.status === "error")
            throw new Error(data.message || "Request failed");
          reply({
            kind: "response",
            requestId: message.requestId,
            ok: true,
            data: data?.data ?? data,
          });
        } catch (error) {
          reply({
            kind: "response",
            requestId: message.requestId,
            ok: false,
            error: error.message,
          });
        }
      });
    </script>
    <iframe
      title="BreezeTTS"
      src="/view/index.html"
      sandbox="allow-scripts allow-forms allow-downloads"
    ></iframe>
  </body>
</html>
