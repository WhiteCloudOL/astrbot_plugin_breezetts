name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocols:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt "pytest>=8,<10" "pytest-asyncio>=0.24,<2" "ruff>=0.11"
      - run: python -m ruff format --isolated --target-version py310 --check .
      - run: python -m ruff check --isolated --target-version py310 --select E,F,W,I,UP,ASYNC,C4,Q --ignore E501,ASYNC230,ASYNC240 .
      - run: python -m pytest -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --input-type=module --check < pages/studio/app.js
        shell: bash

  integration:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        host:
          - name: "4.26.0"
            commit: "952d1bfad7e516df5c5dd4f9e7414b81cb4e5bde"
          - name: "4.29.4"
            commit: "86c24e846c0de78830f6a0bc402049edb0f0c671"
    name: integration (${{ matrix.os }}, AstrBot ${{ matrix.host.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: astrbot_plugin_breezetts
    env:
      PYTHONPATH: ${{ github.workspace }}/astrbot
      BREEZE_BROWSER_TEST: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: astrbot_plugin_breezetts
      - uses: actions/checkout@v4
        with:
          repository: AstrBotDevs/AstrBot
          ref: ${{ matrix.host.commit }}
          path: astrbot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ../astrbot -r requirements.txt "pytest>=8,<10" "pytest-asyncio>=0.24,<2" "pytest-timeout>=2.4,<3" playwright
      - run: python -m playwright install --with-deps chromium
      # Third-party splitter checks remain opt-in; all core integration skips fail.
      - run: python -m pytest -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function -o faulthandler_timeout=90 --timeout=120 --timeout-method=thread --require-integration --ignore=tests/test_live.py -k "not splitter" -vv tests
        timeout-minutes: 5
        env:
          BREEZE_SCREENSHOT_DIR: ${{ runner.temp }}/breeze-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.os }}-${{ matrix.host.name }}
          path: ${{ runner.temp }}/breeze-screenshots
